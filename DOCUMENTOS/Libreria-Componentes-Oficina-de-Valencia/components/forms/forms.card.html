<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:20px}</style>
<div id="root"></div>
<script type="text/babel">
const { TextField, TextArea, Select, DatePicker, SearchBar, Checkbox } = window.OFICINADEVALENCIA_a871c7;
function Demo(){
  const [name, setName] = React.useState("María Fernández");
  const [note, setNote] = React.useState("Interesada en ampliar la cobertura de auto, pendiente de confirmar presupuesto.");
  const [channel, setChannel] = React.useState("whatsapp");
  const [date, setDate] = React.useState("2026-07-20");
  const [query, setQuery] = React.useState("Laura");
  const [password, setPassword] = React.useState("miriam2026");
  const [createReminder, setCreateReminder] = React.useState(true);

  return <div style={{display:"flex",flexDirection:"column",gap:16,maxWidth:340}}>
    <TextField label="Nombre del cliente" value={name} onChange={setName} placeholder="Escribe un nombre…" />
    <TextField label="Email" value="" onChange={()=>{}} error="Formato de email no válido" />
    <TextField label="Contraseña" type="password" value={password} onChange={setPassword} />
    <TextArea label="Nota" value={note} onChange={setNote} rows={3} />
    <Select label="Canal de entrada" value={channel} onChange={setChannel} placeholder="Selecciona un canal…"
      options={[
        { value: "llamada", label: "Llamada" },
        { value: "whatsapp", label: "WhatsApp" },
        { value: "web", label: "Web" },
        { value: "redes", label: "Redes sociales" },
        { value: "presencial", label: "Presencial" },
      ]} />
    <Select label="Estado de venta" value="" onChange={()=>{}} placeholder="Selecciona un estado…" error="Selecciona un estado"
      options={[{ value: "interesado", label: "Interesado" }]} />
    <DatePicker label="Fecha del recordatorio" value={date} onChange={setDate} />
    <Checkbox label="Crear recordatorio de seguimiento" checked={createReminder} onChange={setCreateReminder} />
    <Checkbox label="Opción deshabilitada" checked={false} disabled />
    <div>
      <div style={{font:"var(--text-meta)",color:"var(--text-tertiary)",marginBottom:8}}>SearchBar (P2, sin label)</div>
      <SearchBar value={query} onChange={setQuery} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
