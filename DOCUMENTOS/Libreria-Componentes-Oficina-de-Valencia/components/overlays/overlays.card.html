<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-app);padding:20px}</style>
<div id="root"></div>
<script type="text/babel">
const { Modal, BottomSheet, Popover, Button, TextArea, Select } = window.OFICINADEVALENCIA_a871c7;

function Demo(){
  const [modalOpen, setModalOpen] = React.useState(false);
  const [sheetOpen, setSheetOpen] = React.useState(false);
  const [note, setNote] = React.useState("");
  const [filter, setFilter] = React.useState("todas");

  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
      <Button onClick={() => setModalOpen(true)}>Abrir Modal (desktop)</Button>
      <Button variant="secondary" onClick={() => setSheetOpen(true)}>Abrir BottomSheet (móvil)</Button>
      <Popover trigger={<Button variant="text" size="compact">Fecha de vencimiento: {filter} ▾</Button>}>
        {["todas","vencidas","para hoy"].map(f => (
          <Button key={f} variant="text" size="compact" onClick={() => setFilter(f)}
            style={{width:"100%",justifyContent:"flex-start",textTransform:"capitalize"}}>{f}</Button>
        ))}
      </Popover>
    </div>

    <Modal open={modalOpen} title="Registrar contacto" onClose={() => setModalOpen(false)}
      footer={<>
        <Button variant="secondary" onClick={() => setModalOpen(false)}>Cancelar</Button>
        <Button onClick={() => setModalOpen(false)}>Guardar</Button>
      </>}>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        <Select label="Tipo de contacto" value="whatsapp" onChange={()=>{}}
          options={[{value:"whatsapp",label:"WhatsApp"},{value:"llamada",label:"Llamada"}]} />
        <TextArea label="Nota" value={note} onChange={setNote} placeholder="¿Qué se habló o acordó?" />
      </div>
    </Modal>

    <BottomSheet open={sheetOpen} title="Añadir siniestro" onClose={() => setSheetOpen(false)}
      footer={<Button onClick={() => setSheetOpen(false)} style={{width:"100%"}}>Guardar</Button>}>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        <Select label="Tipo de siniestro" value="" onChange={()=>{}} placeholder="Selecciona un tipo…"
          options={[{value:"agua",label:"Daño por agua"},{value:"robo",label:"Robo"}]} />
        <TextArea label="Descripción" value="" onChange={()=>{}} placeholder="Detalle del caso…" />
      </div>
    </BottomSheet>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
