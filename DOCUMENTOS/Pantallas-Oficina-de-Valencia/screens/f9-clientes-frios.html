<!-- @dsCard group="Pantallas" viewport="390x760" name="F9 — Clientes fríos" subtitle="Vista filtrada sobre P2 para el agente: clientes en proceso sin contacto reciente, ordenable" -->
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;font-family:var(--font-sans);background:var(--surface-app)}</style>
<div id="root" style="height:760px;overflow:hidden"></div>
<script type="text/babel">
const { FilterChip, SectionCard, ClientRow, Button, MainNav, SortToggle } = window.OFICINADEVALENCIA_a871c7;

function Demo(){
  const [filter, setFilter] = React.useState("frios");
  const [sortDir, setSortDir] = React.useState("desc");
  const [clients] = React.useState([
    { id: 1, name: "Beatriz Molina", saleStatus: "interesado", days: 34 },
    { id: 2, name: "Javier Ruiz", saleStatus: "presupuesto", priority: "alta", days: 41 },
    { id: 3, name: "Sara Campos", saleStatus: "interesado", days: 30 },
  ]);

  const sorted = [...clients].sort((a, b) => sortDir === "desc" ? b.days - a.days : a.days - b.days);

  return <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
    <div style={{padding:"var(--space-5) var(--space-4) var(--space-3)"}}>
      <div style={{font:"var(--text-meta)",color:"var(--text-tertiary)",marginBottom:4}}>F9 — Clientes fríos (T12)</div>
      <h1 style={{margin:"0 0 var(--space-1)",font:"var(--text-title)",color:"var(--text-primary)"}}>Clientes fríos</h1>
      <p style={{margin:"0 0 var(--space-4)",font:"var(--text-meta)",color:"var(--text-tertiary)"}}>Sin contacto hace más de 30 días · en proceso (no cerrados ni perdidos)</p>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:8}}>
          <FilterChip label="Todos los clientes" active={filter === "todos"} onClick={() => setFilter("todos")} />
          <FilterChip label={`Fríos (${clients.length})`} active={filter === "frios"} onClick={() => setFilter("frios")} />
        </div>
        <SortToggle label="Días sin contacto" direction={sortDir} onToggle={() => setSortDir(d => d === "desc" ? "asc" : "desc")} />
      </div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"0 var(--space-4) var(--space-4)"}}>
      <SectionCard>
        {sorted.map((c, i) => (
          <ClientRow key={c.id} name={c.name} saleStatus={c.saleStatus} priority={c.priority}
            subtitle={`${c.days} días sin contacto`}
            action={<Button variant="secondary" size="compact" onClick={() => console.log("registrar contacto", c.id)}>Registrar contacto</Button>}
            divider={i < sorted.length - 1}
            onClick={() => console.log("open client", c.id)} />
        ))}
      </SectionCard>
    </div>
    <MainNav mode="mobile" active="clients" onNavigate={k => console.log("nav", k)} />
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
